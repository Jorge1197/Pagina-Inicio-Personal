<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Pestaña</title>
    <style>
        /* ESTILOS VISUALES */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif; /* Fuente limpia estilo Windows */
            color: white;
            background-color: #333;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }

        /* Sombra para que el texto se lea bien sobre cualquier fondo */
        .container {
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        #greeting {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0px;
        }

        #clock {
            font-size: 6rem;
            font-weight: 700;
            margin: 0;
            line-height: 1;
        }
        
        /* Botón de configuración discreto (opcional) */
        .settings-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="greeting">Buenos días</div>
        <div id="clock">00:00</div>
    </div>

    <script>
    // --- CONFIGURACIÓN DE FONDOS ---
    // Define la URL base de tu repositorio en bruto
    const BASE_URL = "https://raw.githubusercontent.com/Jorge1197/Pagina-Inicio-Personal/main/fondos/";
    
    const wallpapers = [
        // Usamos la URL base + el nombre del archivo
        BASE_URL + "Fondo1.jpeg", 
        BASE_URL + "Fondo2.jpg",
        BASE_URL + "Fondo3.jpg",
        BASE_URL + "Fondo4.jpg",
        BASE_URL + "Fondo5.jpg",
        BASE_URL + "Fondo6.jpg",
        BASE_URL + "Fondo7.jpg",
        BASE_URL + "Fondo8.jpg",
        BASE_URL + "Fondo9.jpg",
        BASE_URL + "Fondo10.jpg",
        BASE_URL + "Fondo11.jpg",
        BASE_URL + "Fondo12.jpg",
        BASE_URL + "Fondo13.jpg",
        BASE_URL + "Fondo14.jpg",
        BASE_URL + "Fondo15.jpg",
    ];

        /* --- LÓGICA DEL RELOJ Y SALUDO --- */
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            // Formato de hora (añade un 0 si es menor a 10)
            const timeString = `${hours}:${minutes < 10 ? '0' + minutes : minutes}`;
            document.getElementById('clock').innerText = timeString;

            // Lógica del saludo
            let greetText = "Buenas noches";
            if (hours >= 6 && hours < 12) greetText = "Buenos días";
            else if (hours >= 12 && hours < 20) greetText = "Buenas tardes";
            
            document.getElementById('greeting').innerText = greetText;
        }

        /* --- LÓGICA DEL FONDO ALEATORIO --- */
        function setRandomBackground() {
            const randomIndex = Math.floor(Math.random() * wallpapers.length);
            document.body.style.backgroundImage = `url('${wallpapers[randomIndex]}')`;
        }

        // Iniciar
        setRandomBackground();
        updateTime();
        setInterval(updateTime, 1000); // Actualizar reloj cada segundo
    </script>

</body>
</html>
